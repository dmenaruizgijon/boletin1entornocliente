<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 5</title>
</head>
<body>
    <h1>Ejercicio 5: Nota media</h1>

    <form>
        <p>
            <label for="nota1">Nota 1er trimestre:</label>
            <input type="text" id="nota1">
        </p>
        <p>
            <label for="nota2">Nota 2º trimestre:</label>
            <input type="text" id="nota2">
        </p>
        <p>
            <label for="nota3">Nota 3er trimestre:</label>
            <input type="text" id="nota3">
        </p>
        <p>
            <input type="button" value="Comprobar" onclick="comprobar()">
        </p>
    </form>

    <script>

        function calcularNotaMedia(n1, n2, n3) {
            return (n1 + n2 + n3) / 3;
        }

        function comprobar() {
            let nota1 = parseFloat(document.getElementById("nota1").value);
            let nota2 = parseFloat(document.getElementById("nota2").value);
            let nota3 = parseFloat(document.getElementById("nota3").value);


            if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
                alert("Debes introducir las tres notas como números");
            } else if (nota1 < 0 || nota1 > 10 || nota2 < 0 || nota2 > 10 || nota3 < 0 || nota3 > 10) {
                alert("Las notas deben estar entre 0 y 10");
            } else {
                let media = calcularNotaMedia(nota1, nota2, nota3);

                if (media >= 5) {
                    alert("Nota media: " + media + ". ¡Has aprobado!");
                } else {
                    alert("Nota media: " + media + ". Has suspendido.");
                }
            }
        }
    </script>
</body>
</html>
